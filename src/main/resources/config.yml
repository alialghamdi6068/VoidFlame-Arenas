settings:
  auto-discover-worlds: true
  discovery-name-prefix: "Arena-"
  discovery-world-name-contains:
    - "duel"
    - "arena"
  persist-to-file: true
  command-permission: "voidflame.arenas.admin"

arenas:
  auto-discover-worlds: true
  list: []
  # Example:
  # - name: Arena-1
  #   world: duels
  #   enabled: true
  #   spawn-a: {x: 0.5, y: 100, z: 0.5, yaw: 90, pitch: 0}
  #   spawn-b: {x: 20.5, y: 100, z: 0.5, yaw: -90, pitch: 0}

messages:
  prefix: "&8[&bVoidFlame-Arenas&8] "
  no-permission: "&cYou do not have permission."
  player-only: "&cThis command can only be used by a player."
  usage: "&7Usage: &f/arena <list|info|create|delete|setspawn|enable|disable|reset|reload>"
  not-found: "&cArena not found: &e<arena>"
  already-exists: "&cAn arena with that name already exists."
  created: "&aArena created: &e<arena>"
  deleted: "&aArena deleted: &e<arena>"
  enabled: "&aArena enabled: &e<arena>"
  disabled: "&aArena disabled: &e<arena>"
  in-use: "&cArena is currently in use."
  reset: "&aArena released: &e<arena>"
  invalid-spawn: "&cThe spawn must belong to the arena's configured world."
  list-empty: "&7No arenas are configured."
  list-header: "&bArenas &7(&f<total>&7) &8| &aavailable=&f<available> &8| &cused=&f<used> &8| &7disabled=&f<disabled>"
  list-entry: "&7- &e<arena> &8| &f<world> &8| &7<state> &8| &7ready=&f<ready>"
  info: "&7Arena &e<arena> &8| &fworld=&e<world> &8| &fstate=&e<state> &8| &fready=&e<ready>\n&7Spawn A: &f<spawnA> &8| &7Spawn B: &f<spawnB>"
  reload: "&aArena configuration reloaded. &7Loaded: &f<count>"
  reload-blocked: "&cCannot reload arenas while a match is using an arena."
  reset-blocked: "&cThe arena is not currently in use."
