name: VoidFlame-Arenas
version: 1.0.0
main: net.voidflame.arenas.VoidFlameArenasPlugin
description: Professional arena management system for VoidFlame MC.
author: VoidFlame
website: https://github.com/alialghamdi6068/VoidFlame-Arenas
api-version: '26.2'
load: POSTWORLD
depend: [VoidFlame-Core]
softdepend: [WorldEdit]

commands:
  arena:
    description: Manage VoidFlame arenas.
    usage: /arena <list|info|create|delete|setspawn|enable|disable|reset>
    permission: voidflame.arena.manage

permissions:
  voidflame.arena.manage:
    description: Manage practice arenas.
    default: op
  voidflame.arena.reset:
    description: Reset practice arenas.
    default: op
  voidflame.arena.bypass:
    description: Bypass arena protection for staff.
    default: op
